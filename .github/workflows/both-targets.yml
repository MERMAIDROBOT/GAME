name: Both product targets
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    name: ${{ matrix.target }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: cpp, os: ubuntu-latest}
          - {target: cpp, os: macos-latest}
          - {target: macos, os: macos-latest}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python run.py --target ${{ matrix.target }} --help
      - run: python run.py --target ${{ matrix.target }} doctor
      - run: python pipeline.py source-package
  # Retail assets, generated game code, binaries and raw game diagnostics are
  # deliberately absent. These jobs test generic contracts, not game playability.

  bundled-macos-adapter:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r requirements.txt
      - run: python platform_adapter.py --adapter platforms/macos/adapter.json --describe
      - run: python run.py --target macos doctor
